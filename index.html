<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<main> 
    <section>
        <div class="allreels">
            <div class="reel">
                <video autoplay loop muted src="reel/video1.mp4.mp4"></video>
                <div class="bottom">
                    <div class="user">
                        <img src="https://plus.unsplash.com/premium_photo-1671541242938-400e56937ba7?q=80&w=626&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                        <h4>Himanshu.gope</h4>
                        <button>follow</button>
                    </div>
                    <h3>Published on November 29, 2022 Licensed under the Unsplash+ License</h3>
                </div>
                <div class="right">
                    <div class="like">
                        <h4 class="like-icon"><i class="ri-heart-3-line"></i></h4>
                        <h6>200</h6>
                    </div>
                    <div class="comment">
                        <h4 class="comment-icon"><i class="ri-chat-3-line"></i></h4>
                        <h6>60</h6>
                    </div>
                      <div class="share">
                        <h4 class="share-icon"><i class="ri-share-forward-line"></i></h4>
                        <h6>30</h6>
                    </div>
                      <div class="menu">
                        <h4 class="menu-icon"><i class="ri-more-2-fill"></i></h4>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
    <script src="script.js"></script>
</body>
</html>
